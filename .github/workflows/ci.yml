name: CI

on:
  pull_request:
    branches: [main, typescript_Nextjs]
  push:
    branches: [main, typescript_Nextjs]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Hard-fail only on critical advisories; high are reported but do not
      # block (dependency upgrades are scheduled work, not CI noise).
      - name: Security audit (critical = fail)
        run: npm audit --audit-level=critical

      - name: Security audit report (high, non-blocking)
        run: npm audit --audit-level=high || true

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  docker-build:
    name: Docker Build + Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -t life-n-grace:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: life-n-grace:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
